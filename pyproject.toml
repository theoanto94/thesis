[project]
name = "thesis"
version = "0.1.0"
description = "Healthcare costs by postal code area (Netherlands), 2011-2023"
requires-python = ">=3.9"
dependencies = [
    "catboost>=1.2.10",
    "dash>=4.1.0",
    "dash-bootstrap-components>=2.0.4",
    "duckdb>=1.4.4",
    "joblib>=1.5.3",
    "lightgbm>=4.6.0",
    "marimo>=0.17.6",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "plotly>=6.7.0",
    "polars[pyarrow]>=1.36.1",
    "scikit-learn>=1.6.1",
    "shap>=0.49.1",
    "sqlglot>=30.7.0",
    "xgboost>=2.1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "python-lsp-ruff>=2.3.4",
    "python-lsp-server>=1.15.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py39"
extend-exclude = ["Thesis_writing", "md", "__marimo__"]

[tool.ruff.lint]
# Pyflakes plus the pycodestyle error rules (ruff's classic default set),
# and docstrings on every public module, class and function outside tests.
select = ["E4", "E7", "E9", "F", "D100", "D101", "D102", "D103"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
