[project]
name = "thesis"
version = "0.1.0"
description = "Healthcare costs by postal code area (Netherlands), 2011-2023"
requires-python = ">=3.9"
dependencies = [
    "altair>=6.0.0",
    "catboost>=1.2.10",
    "dash>=4.1.0",
    "dash-bootstrap-components>=2.0.4",
    "duckdb>=1.4.4",
    "joblib>=1.5.3",
    "lightgbm>=4.6.0",
    "marimo>=0.17.6",
    "nbformat>=5.10.4",
    "numpy>=2.0.2",
    "openai>=2.34.0",
    "pandas>=2.3.3",
    "plotly>=6.7.0",
    "polars[pyarrow]>=1.36.1",
    "pytest>=8.4.2",
    "python-lsp-ruff>=2.3.1",
    "python-lsp-server>=1.14.0",
    "ruff>=0.15.12",
    "scikit-learn>=1.6.1",
    "shap>=0.49.1",
    "sqlglot>=30.7.0",
    "vegafusion>=2.0.3",
    "vl-convert-python>=1.9.0.post1",
    "websockets>=15.0.1",
    "xgboost>=2.1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
